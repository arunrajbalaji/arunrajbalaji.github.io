<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Callout</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;display=swap">
<style>
  body { margin: 0; padding: var(--space-20, 20px); background: var(--ground, #F3F4F1); color: var(--ink, #16181A); font-family: var(--font-sans, Barlow, "Helvetica Neue", Helvetica, sans-serif); }
  .rb-callout { display: flex; gap: 14px; max-width: var(--measure, 700px); }
  .rb-callout-mark { flex: 0 0 10px; height: 10px; margin-top: 10px; background: var(--accent, #0F7B74); }
  .rb-callout p { margin: 0; font-size: var(--callout-size, clamp(20px, 1.9vw, 24px)); line-height: 1.3; font-weight: 500; text-wrap: pretty; }
</style>
</head>
<body>
<div class="rb-callout">
  <span class="rb-callout-mark" aria-hidden="true"></span>
  <p>At Stanford and at Ark, that loop has delivered 10 to 100-fold gains in simulation cost and robustness.</p>
</div>
</body>
</html>
