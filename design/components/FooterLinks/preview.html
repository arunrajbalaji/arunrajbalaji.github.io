<!doctype html>

<title>FooterLinks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
  body { margin: 0; background: var(--ground, #F3F4F1); color: var(--ink, #16181A); }
  .rb-footer { max-width: var(--container, 1160px); margin: 0 auto; padding: var(--space-16, 16px) var(--gutter, clamp(20px, 3.2vw, 40px)); }
  .rb-footer nav { display: flex; flex-wrap: wrap; gap: 0 var(--space-28, 28px); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); font-size: 13.5px; line-height: 1.4; }
  .rb-footer a { display: inline-flex; align-items: center; min-height: var(--tap, 44px); color: var(--link, #0F7B74); }
  .rb-footer a:hover { color: var(--link-hover, #0A5650); }
  .rb-footer a:focus-visible { outline: var(--border-strong, 2px) solid var(--focus, #16181A); outline-offset: var(--border-strong, 2px); }
</style>
</head>
<body>
