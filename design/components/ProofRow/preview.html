<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ProofRow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;display=swap">
<style>
  body { margin: 0; padding: var(--space-20, 20px); background: var(--ground, #F3F4F1); color: var(--ink, #16181A); font-family: var(--font-sans, Barlow, "Helvetica Neue", Helvetica, sans-serif); }
  .rb-proof { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(var(--cell-min, 220px), 100%), 1fr)); border-top: var(--border-strong, 2px) solid var(--rule-strong, #16181A); border-left: var(--border-hairline, 1px) solid var(--rule, #C5C9C6); background: var(--inset, #FBFBF9); }
  .rb-proof li { padding: var(--space-16, 16px) 18px; border-right: var(--border-hairline, 1px) solid var(--rule, #C5C9C6); border-bottom: var(--border-hairline, 1px) solid var(--rule, #C5C9C6); font-size: 16px; line-height: 1.35; }
</style>
</head>
<body>
<ul class="rb-proof">
  <li>Ph.D., Stanford, Kruger Graduate Fellow</li>
  <li>B.S.E., Princeton</li>
  <li>Stanford Centennial Teaching Assistant Award</li>
  <li>3 peer-reviewed papers and 12 presentations</li>
</ul>
</body>
</html>
